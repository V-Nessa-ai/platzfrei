<!doctype html>
<html lang="de">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Szenen-Prompt-Baukasten</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#ECEFEF;
    --surface:#FFFFFF;
    --surface-2:#F4F7F7;
    --ink:#131A1C;
    --muted:#5B686D;
    --line:#D2DADB;
    --line-strong:#B9C4C6;
    --accent:#1C6B73;
    --accent-ink:#FFFFFF;
    --accent-soft:#DDEDEE;
    --warm:#A9532A;
    --shadow:0 1px 2px rgba(19,26,28,.05), 0 10px 26px -18px rgba(19,26,28,.5);
    --radius:10px;
    --display:"Archivo","Helvetica Neue",Arial,sans-serif;
    --body:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0E1213;
      --surface:#161C1E;
      --surface-2:#1B2325;
      --ink:#E7EDEE;
      --muted:#95A3A7;
      --line:#2A3436;
      --line-strong:#3A484B;
      --accent:#5CBAC2;
      --accent-ink:#08191B;
      --accent-soft:#163033;
      --warm:#DE9055;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 30px -20px rgba(0,0,0,.9);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0E1213;
    --surface:#161C1E;
    --surface-2:#1B2325;
    --ink:#E7EDEE;
    --muted:#95A3A7;
    --line:#2A3436;
    --line-strong:#3A484B;
    --accent:#5CBAC2;
    --accent-ink:#08191B;
    --accent-soft:#163033;
    --warm:#DE9055;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 30px -20px rgba(0,0,0,.9);
  }

  *{box-sizing:border-box}
  [hidden]{display:none !important}
  img{max-width:100%}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--body);
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:1300px;
    margin:0 auto;
    padding-inline:16px;
    padding-block:28px 64px;
  }
  @media (min-width:760px){ .wrap{padding-inline:28px} }

  /* ---------- Kopfzeile ---------- */
  .masthead{
    display:flex;
    flex-wrap:wrap;
    align-items:flex-end;
    justify-content:space-between;
    gap:16px 24px;
    padding-bottom:18px;
    border-bottom:2px solid var(--ink);
  }
  .masthead h1{
    font-family:var(--display);
    font-weight:700;
    font-size:clamp(26px,4.2vw,40px);
    letter-spacing:-.02em;
    line-height:1.05;
    margin:0;
    text-wrap:balance;
  }
  .masthead p{
    margin:6px 0 0;
    color:var(--muted);
    max-width:56ch;
  }
  .masthead-tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

  .seg{
    display:inline-flex;
    border:1px solid var(--line-strong);
    border-radius:999px;
    overflow:hidden;
    background:var(--surface);
  }
  .seg label{position:relative;display:block}
  .seg input{position:absolute;opacity:0;width:100%;height:100%;left:0;top:0;margin:0;cursor:pointer}
  .seg span{
    display:block;
    padding:7px 14px;
    font-size:12px;
    font-weight:600;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--muted);
  }
  .seg label:has(input:checked) span{background:var(--ink);color:var(--bg)}
  .seg label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}

  .runtime{
    font-family:var(--mono);
    font-size:12px;
    font-variant-numeric:tabular-nums;
    color:var(--muted);
    white-space:nowrap;
  }
  .runtime b{color:var(--warm);font-weight:500;font-size:15px}

  /* ---------- Board ---------- */
  .board{
    display:grid;
    grid-template-columns:minmax(0,1fr);
    gap:24px;
    margin-top:24px;
    align-items:start;
  }
  @media (min-width:1040px){
    .board{grid-template-columns:minmax(0,1fr) 400px;gap:28px}
  }

  .panel{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
  }
  .panel-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:14px 16px;
    border-bottom:1px solid var(--line);
  }
  .eyebrow{
    font-family:var(--display);
    font-size:11px;
    font-weight:700;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--muted);
    margin:0;
  }

  textarea,input[type="text"]{
    width:100%;
    font-family:inherit;
    font-size:15px;
    color:var(--ink);
    background:transparent;
    border:none;
    padding:0;
  }
  textarea:focus,input[type="text"]:focus{outline:none}
  textarea{resize:vertical;line-height:1.55}
  ::placeholder{color:var(--muted);opacity:.75}

  .field{padding:14px 16px 16px}
  .field textarea{min-height:92px}

  .hint{
    margin:0;
    padding:0 16px 14px;
    font-size:12.5px;
    color:var(--muted);
  }

  .editor{display:flex;flex-direction:column;gap:18px}

  /* ---------- Szenenkarte ---------- */
  .scene{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    overflow:hidden;
  }
  .scene-head{
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px 12px 10px 0;
    border-bottom:1px solid var(--line);
    background:var(--surface-2);
  }
  .slate{
    align-self:stretch;
    display:flex;
    align-items:center;
    padding:0 14px;
    background:var(--ink);
    color:var(--bg);
    font-family:var(--mono);
    font-size:12px;
    font-weight:500;
    letter-spacing:.08em;
    white-space:nowrap;
  }
  .scene-title{
    flex:1 1 180px;
    min-width:0;
    font-family:var(--display);
    font-weight:600;
    font-size:17px;
    letter-spacing:-.01em;
  }
  .scene-actions{display:flex;gap:4px;flex:0 0 auto}

  button{font:inherit;color:inherit;cursor:pointer}
  .icon-btn{
    width:30px;height:30px;
    display:grid;place-items:center;
    border:1px solid transparent;
    border-radius:7px;
    background:transparent;
    color:var(--muted);
    font-size:14px;
    line-height:1;
  }
  .icon-btn:hover{background:var(--accent-soft);color:var(--accent);border-color:var(--line)}
  .icon-btn:disabled{opacity:.3;cursor:not-allowed;background:transparent;color:var(--muted);border-color:transparent}
  .icon-btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

  .scene-body{padding:14px 16px 4px}
  .scene-body textarea{min-height:76px}

  .cols{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(168px,1fr));
    gap:18px;
    padding:16px;
  }
  .col{display:flex;flex-direction:column;gap:8px;min-width:0}
  .col > .eyebrow{padding-bottom:6px;border-bottom:1px solid var(--line)}

  .chip{position:relative;display:block}
  .chip input{position:absolute;opacity:0;width:100%;height:100%;left:0;top:0;margin:0;cursor:pointer}
  .chip .box{
    display:block;
    padding:7px 10px;
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--surface);
    transition:background .12s ease,border-color .12s ease;
  }
  .chip:hover .box{border-color:var(--line-strong);background:var(--surface-2)}
  .chip .de{display:block;font-size:13.5px;font-weight:500;line-height:1.25}
  .chip .en{display:block;font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:2px;line-height:1.3}
  .chip .why{display:block;font-size:11px;color:var(--muted);margin-top:4px;line-height:1.35}
  .chip:has(input:checked) .box{
    background:var(--accent-soft);
    border-color:var(--accent);
    box-shadow:inset 2px 0 0 var(--accent);
  }
  .chip:has(input:checked) .en{color:var(--accent)}
  .chip:has(input:focus-visible) .box{outline:2px solid var(--accent);outline-offset:2px}

  .scene-foot{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
    padding:10px 16px;
    border-top:1px solid var(--line);
    background:var(--surface-2);
  }
  .tc{
    font-family:var(--mono);
    font-size:12px;
    font-variant-numeric:tabular-nums;
    color:var(--muted);
  }
  .tc b{color:var(--warm);font-weight:500}

  .btn{
    display:inline-flex;
    align-items:center;
    gap:7px;
    padding:8px 14px;
    border-radius:8px;
    border:1px solid var(--line-strong);
    background:var(--surface);
    font-size:13px;
    font-weight:600;
  }
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .btn-primary:hover{color:var(--accent-ink);filter:brightness(1.08)}
  .btn-ghost{border-style:dashed;justify-content:center;width:100%;padding:14px;color:var(--muted)}
  .btn-ghost:hover{color:var(--accent);border-style:solid}
  .btn-sm{padding:6px 11px;font-size:12px}

  /* ---------- Ausgabe ---------- */
  .output{position:relative}
  @media (min-width:1040px){
    .output{position:sticky;top:calc(env(safe-area-inset-top,0px) + 20px)}
  }
  .switch{
    display:flex;
    align-items:flex-start;
    gap:9px;
    padding:12px 16px;
    border-bottom:1px solid var(--line);
    font-size:12.5px;
    color:var(--muted);
    cursor:pointer;
  }
  .switch input{margin:2px 0 0;accent-color:var(--accent);flex:0 0 auto}
  pre.out{
    margin:0;
    padding:16px;
    max-height:min(58vh,620px);
    overflow:auto;
    font-family:var(--mono);
    font-size:12.5px;
    line-height:1.6;
    white-space:pre-wrap;
    word-break:break-word;
    color:var(--ink);
    background:var(--surface-2);
    border-radius:0 0 var(--radius) var(--radius);
  }
  .out-foot{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}

  .toast{
    position:fixed;
    left:50%;
    bottom:calc(env(safe-area-inset-bottom,0px) + 22px);
    transform:translate(-50%,14px);
    padding:9px 18px;
    border-radius:999px;
    background:var(--ink);
    color:var(--bg);
    font-size:13px;
    font-weight:500;
    box-shadow:var(--shadow);
    opacity:0;
    pointer-events:none;
    transition:opacity .18s ease,transform .18s ease;
    z-index:20;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
  @media (prefers-reduced-motion:reduce){
    *{transition:none !important;animation:none !important}
  }
  .sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
</style>

<div class="wrap">
  <header class="masthead">
    <div>
      <h1>Szenen-Prompt-Baukasten</h1>
      <p>Hauptprompt einmal schreiben, Szenen zusammenklicken – hinten fällt ein fertiger Prompt heraus.</p>
    </div>
    <div class="masthead-tools">
      <div class="runtime">Gesamtlänge <b id="runtime">00:00</b></div>
      <div class="seg" role="radiogroup" aria-label="Sprache des erzeugten Prompts">
        <label><input type="radio" name="lang" id="lang-de" value="de"><span>Deutsch</span></label>
        <label><input type="radio" name="lang" id="lang-en" value="en"><span>English</span></label>
      </div>
    </div>
  </header>

  <div class="board">
    <div class="editor">
      <section class="panel">
        <div class="panel-head">
          <h2 class="eyebrow">Hauptprompt</h2>
          <button class="btn btn-sm" id="reset" type="button">Alles leeren</button>
        </div>
        <div class="field">
          <label class="sr" for="main-prompt">Hauptprompt</label>
          <textarea id="main-prompt" placeholder="Stil, Look, Licht, Marke, Sprache der Figuren – alles, was für jede Szene gilt."></textarea>
        </div>
        <p class="hint">Gilt für das ganze Video. Steht je nach Einstellung rechts entweder einmal oben oder vor jeder einzelnen Szene.</p>
      </section>

      <div id="scenes" class="editor"></div>

      <button class="btn btn-ghost" id="add-scene" type="button">+ Szene hinzufügen</button>
    </div>

    <section class="panel output">
      <div class="panel-head">
        <h2 class="eyebrow">Erzeugter Prompt</h2>
        <span class="tc" id="charcount">0 Zeichen</span>
      </div>
      <label class="switch" for="repeat-main">
        <input type="checkbox" id="repeat-main">
        <span>Hauptprompt vor jeder Szene wiederholen – so ist jede Szene für sich allein einsetzbar.</span>
      </label>
      <pre class="out" id="out" aria-live="polite"></pre>
      <div class="out-foot">
        <button class="btn btn-primary" id="copy-all" type="button">Alles kopieren</button>
      </div>
    </section>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  "use strict";

  /* ---------------------------------------------------------------
     Spalten. Neue Auswahlspalte? Hier einen Block ergänzen – die
     Karten und der Prompt-Text bauen sich daraus von selbst.
  ----------------------------------------------------------------*/
  var COLUMNS = [
    {
      key:"res", label:"Auflösung", promptDe:"Auflösung", promptEn:"Resolution",
      options:[
        {id:"720p",  de:"720p",  en:"1280 × 720",  textDe:"720p (1280 × 720)",  textEn:"720p (1280 × 720)"},
        {id:"1080p", de:"1080p", en:"1920 × 1080", textDe:"1080p (1920 × 1080)", textEn:"1080p (1920 × 1080)"}
      ]
    },
    {
      key:"dur", label:"Länge", promptDe:"Länge", promptEn:"Duration",
      options:[
        {id:"5",  de:"5 Sekunden",  en:"00:05", textDe:"5 Sekunden",  textEn:"5 seconds",  secs:5},
        {id:"8",  de:"8 Sekunden",  en:"00:08", textDe:"8 Sekunden",  textEn:"8 seconds",  secs:8},
        {id:"10", de:"10 Sekunden", en:"00:10", textDe:"10 Sekunden", textEn:"10 seconds", secs:10},
        {id:"15", de:"15 Sekunden", en:"00:15", textDe:"15 Sekunden", textEn:"15 seconds", secs:15}
      ]
    },
    {
      key:"persp", label:"Perspektive", promptDe:"Perspektive", promptEn:"Camera angle",
      options:[
        {id:"bird",  de:"Vogelperspektive", en:"bird's-eye view",        textDe:"Vogelperspektive (bird's-eye view, top-down)", textEn:"bird's-eye view (top-down)"},
        {id:"high",  de:"Aufsicht",         en:"high angle",             textDe:"Aufsicht / Obersicht (high angle)",            textEn:"high angle shot"},
        {id:"eye",   de:"Augenhöhe",        en:"eye-level shot",         textDe:"Augenhöhe (eye-level shot)",                   textEn:"eye-level shot"},
        {id:"low",   de:"Untersicht",       en:"low angle",              textDe:"Untersicht (low angle)",                       textEn:"low angle shot"},
        {id:"worm",  de:"Froschperspektive",en:"worm's-eye view",        textDe:"Froschperspektive (worm's-eye view)",          textEn:"worm's-eye view"},
        {id:"drone", de:"Drohnenflug",      en:"aerial / drone shot",    textDe:"Drohnen-Perspektive (aerial drone shot)",      textEn:"aerial drone shot"},
        {id:"ots",   de:"Über die Schulter",en:"over-the-shoulder",      textDe:"Über die Schulter (over-the-shoulder, OTS)",   textEn:"over-the-shoulder shot (OTS)"}
      ]
    },
    {
      key:"shot", label:"Einstellungsgröße", promptDe:"Einstellung", promptEn:"Shot size",
      options:[
        {id:"macro",  de:"Makroaufnahme",   en:"extreme close-up", why:"Winzige Details: Iris eines Auges, Struktur eines Wassertropfens.", textDe:"Makroaufnahme (macro shot, extreme close-up)", textEn:"macro shot (extreme close-up)"},
        {id:"close",  de:"Nahaufnahme",     en:"close-up",         why:"Gesicht einer Person oder ein einzelnes Objekt.",                   textDe:"Nahaufnahme (close-up)",                      textEn:"close-up"},
        {id:"medium", de:"Amerikanische",   en:"medium / waist shot", why:"Personen von der Hüfte aufwärts.",                              textDe:"Amerikanische Einstellung (medium shot, ab Hüfte)", textEn:"medium shot (waist-up)"},
        {id:"wide",   de:"Totale",          en:"wide / long shot", why:"Motiv komplett, eingebettet in seine Umgebung.",                    textDe:"Totale (wide shot)",                          textEn:"wide shot"}
      ]
    }
  ];

  var STORE_KEY = "szenen-prompt-baukasten-v1";
  var LABELS = {
    de:{main:"HAUPTPROMPT", base:"Grundsetup", scene:"SZENE", image:"Bild", camera:"Kamera", tech:"Technik", untitled:"Ohne Titel"},
    en:{main:"MAIN PROMPT", base:"Base prompt", scene:"SCENE", image:"Action", camera:"Camera", tech:"Output", untitled:"Untitled"}
  };
  var RULE = "────────────────────────────────────";

  function uid(){ return "s" + Math.random().toString(36).slice(2,9); }

  function demo(){
    return {
      lang:"de",
      repeatMain:true,
      main:"Werbespot für die App »platzfrei« – Platzbuchung für Tennisvereine und Reitanlagen. Fotorealistisch, warmes Spätnachmittagslicht, ruhige Kamerabewegungen, sattes Sandplatz-Rot und Vereinsgrün, kein eingeblendeter Text.",
      scenes:[
        {id:uid(), title:"Anflug auf die Anlage", desc:"Langsamer Flug über eine Tennisanlage am Ortsrand: drei frisch abgezogene Sandplätze, lange Schatten der Zaunpfosten, davor ein Vereinsheim mit offener Terrasse.", res:"1080p", dur:"8", persp:"drone", shot:"wide"},
        {id:uid(), title:"Buchung am Handy", desc:"Hände halten ein Smartphone, im Display leuchtet der freie Platz 2 um 18:00 auf und wird mit einem Tippen gebucht. Im Hintergrund unscharf die rote Asche.", res:"720p", dur:"5", persp:"high", shot:"close"},
        {id:uid(), title:"Der erste Aufschlag", desc:"Zwei Spielerinnen betreten den gebuchten Platz, eine wirft den Ball zum Aufschlag hoch, feiner Staub tanzt im Gegenlicht.", res:"1080p", dur:"10", persp:"low", shot:"wide"}
      ]
    };
  }

  function blankScene(){
    return {id:uid(), title:"", desc:"", res:"1080p", dur:"8", persp:"eye", shot:"wide"};
  }

  var state = load() || demo();

  function load(){
    try{
      var raw = localStorage.getItem(STORE_KEY);
      if(!raw) return null;
      var data = JSON.parse(raw);
      if(!data || !Array.isArray(data.scenes) || !data.scenes.length) return null;
      data.scenes.forEach(function(s){ if(!s.id) s.id = uid(); });
      return data;
    }catch(e){ return null; }
  }

  var saveTimer = null;
  function save(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function(){
      try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
    }, 250);
  }

  function col(key){
    for(var i=0;i<COLUMNS.length;i++){ if(COLUMNS[i].key === key) return COLUMNS[i]; }
    return null;
  }
  function option(key, id){
    var c = col(key); if(!c) return null;
    for(var i=0;i<c.options.length;i++){ if(c.options[i].id === id) return c.options[i]; }
    return c.options[0];
  }
  function text(opt){
    if(!opt) return "";
    return state.lang === "en" ? opt.textEn : opt.textDe;
  }
  function seconds(scene){
    var o = option("dur", scene.dur);
    return o && o.secs ? o.secs : 0;
  }
  function timecode(total){
    var m = Math.floor(total/60), s = total%60;
    return (m<10?"0":"") + m + ":" + (s<10?"0":"") + s;
  }

  /* ---------------------------- Prompt ---------------------------- */

  function sceneText(scene, index){
    var L = LABELS[state.lang];
    var head = L.scene + " " + (index+1) + " · " + (scene.title.trim() || L.untitled);
    var lines = [head, RULE];

    if(state.repeatMain && state.main.trim()){
      lines.push(L.base + ": " + state.main.trim());
    }
    if(scene.desc.trim()){
      lines.push(L.image + ": " + scene.desc.trim());
    }
    lines.push(L.camera + ": " + text(option("persp", scene.persp)) + ", " + text(option("shot", scene.shot)));
    lines.push(L.tech + ": " + text(option("res", scene.res)) + ", " + text(option("dur", scene.dur)));
    return lines.join("\n");
  }

  function fullText(){
    var L = LABELS[state.lang];
    var blocks = [];
    if(!state.repeatMain && state.main.trim()){
      blocks.push(L.main + "\n" + RULE + "\n" + state.main.trim());
    }
    state.scenes.forEach(function(scene, i){ blocks.push(sceneText(scene, i)); });
    return blocks.join("\n\n");
  }

  /* ---------------------------- Aufbau ---------------------------- */

  var scenesEl = document.getElementById("scenes");
  var outEl = document.getElementById("out");
  var runtimeEl = document.getElementById("runtime");
  var countEl = document.getElementById("charcount");
  var mainEl = document.getElementById("main-prompt");
  var repeatEl = document.getElementById("repeat-main");
  var toastEl = document.getElementById("toast");

  function buildScene(scene, index){
    var card = document.createElement("section");
    card.className = "scene";

    var head = document.createElement("div");
    head.className = "scene-head";

    var slate = document.createElement("div");
    slate.className = "slate";
    slate.textContent = "SZ " + (index < 9 ? "0" : "") + (index+1);
    head.appendChild(slate);

    var titleLabel = document.createElement("label");
    titleLabel.className = "sr";
    titleLabel.setAttribute("for", "title-" + scene.id);
    titleLabel.textContent = "Titel von Szene " + (index+1);
    head.appendChild(titleLabel);

    var title = document.createElement("input");
    title.type = "text";
    title.id = "title-" + scene.id;
    title.className = "scene-title";
    title.placeholder = "Szenentitel";
    title.value = scene.title;
    title.addEventListener("input", function(){ scene.title = title.value; render(); save(); });
    head.appendChild(title);

    var actions = document.createElement("div");
    actions.className = "scene-actions";
    actions.appendChild(iconBtn("↑", "Szene nach oben", index === 0, function(){ move(index,-1); }));
    actions.appendChild(iconBtn("↓", "Szene nach unten", index === state.scenes.length-1, function(){ move(index,1); }));
    actions.appendChild(iconBtn("⧉", "Szene duplizieren", false, function(){ duplicate(index); }));
    actions.appendChild(iconBtn("✕", "Szene löschen", state.scenes.length === 1, function(){ remove(index); }));
    head.appendChild(actions);
    card.appendChild(head);

    var body = document.createElement("div");
    body.className = "scene-body";
    var descLabel = document.createElement("label");
    descLabel.className = "sr";
    descLabel.setAttribute("for", "desc-" + scene.id);
    descLabel.textContent = "Beschreibung von Szene " + (index+1);
    var desc = document.createElement("textarea");
    desc.id = "desc-" + scene.id;
    desc.placeholder = "Was passiert in dieser Szene? Motiv, Handlung, Ort, Licht.";
    desc.value = scene.desc;
    desc.addEventListener("input", function(){ scene.desc = desc.value; render(); save(); });
    body.appendChild(descLabel);
    body.appendChild(desc);
    card.appendChild(body);

    var cols = document.createElement("div");
    cols.className = "cols";
    COLUMNS.forEach(function(c){
      var wrapper = document.createElement("div");
      wrapper.className = "col";

      var heading = document.createElement("p");
      heading.className = "eyebrow";
      heading.id = "col-" + c.key + "-" + scene.id;
      heading.textContent = c.label;
      wrapper.appendChild(heading);

      var group = document.createElement("div");
      group.setAttribute("role", "radiogroup");
      group.setAttribute("aria-labelledby", heading.id);
      group.style.display = "flex";
      group.style.flexDirection = "column";
      group.style.gap = "6px";

      c.options.forEach(function(opt){
        var chip = document.createElement("label");
        chip.className = "chip";

        var input = document.createElement("input");
        input.type = "radio";
        input.name = c.key + "-" + scene.id;
        input.id = c.key + "-" + opt.id + "-" + scene.id;
        input.value = opt.id;
        input.checked = scene[c.key] === opt.id;
        input.addEventListener("change", function(){
          if(!input.checked) return;
          scene[c.key] = opt.id;
          render();
          save();
        });

        var box = document.createElement("span");
        box.className = "box";

        var de = document.createElement("span");
        de.className = "de";
        de.textContent = opt.de;
        box.appendChild(de);

        var en = document.createElement("span");
        en.className = "en";
        en.textContent = opt.en;
        box.appendChild(en);

        if(opt.why){
          var why = document.createElement("span");
          why.className = "why";
          why.textContent = opt.why;
          box.appendChild(why);
        }

        chip.appendChild(input);
        chip.appendChild(box);
        group.appendChild(chip);
      });

      wrapper.appendChild(group);
      cols.appendChild(wrapper);
    });
    card.appendChild(cols);

    var foot = document.createElement("div");
    foot.className = "scene-foot";
    var tc = document.createElement("span");
    tc.className = "tc";
    tc.innerHTML = "Timecode ";
    var tcVal = document.createElement("b");
    tcVal.textContent = timecode(seconds(scene));
    tc.appendChild(tcVal);
    foot.appendChild(tc);

    var copyBtn = document.createElement("button");
    copyBtn.type = "button";
    copyBtn.className = "btn btn-sm";
    copyBtn.textContent = "Nur diese Szene kopieren";
    copyBtn.addEventListener("click", function(){
      copy(sceneText(scene, state.scenes.indexOf(scene)), "Szene kopiert");
    });
    foot.appendChild(copyBtn);
    card.appendChild(foot);

    return card;
  }

  function iconBtn(glyph, label, disabled, onClick){
    var b = document.createElement("button");
    b.type = "button";
    b.className = "icon-btn";
    b.textContent = glyph;
    b.title = label;
    b.setAttribute("aria-label", label);
    b.disabled = !!disabled;
    b.addEventListener("click", onClick);
    return b;
  }

  function renderScenes(){
    scenesEl.textContent = "";
    state.scenes.forEach(function(scene, i){
      scenesEl.appendChild(buildScene(scene, i));
    });
  }

  function render(){
    var out = fullText();
    outEl.textContent = out;
    countEl.textContent = out.length.toLocaleString("de-DE") + " Zeichen";
    var total = state.scenes.reduce(function(sum, s){ return sum + seconds(s); }, 0);
    runtimeEl.textContent = timecode(total);
  }

  /* ---------------------------- Aktionen ---------------------------- */

  function move(index, delta){
    var target = index + delta;
    if(target < 0 || target >= state.scenes.length) return;
    var moved = state.scenes.splice(index,1)[0];
    state.scenes.splice(target,0,moved);
    renderScenes(); render(); save();
  }

  function duplicate(index){
    var copyScene = JSON.parse(JSON.stringify(state.scenes[index]));
    copyScene.id = uid();
    state.scenes.splice(index+1, 0, copyScene);
    renderScenes(); render(); save();
  }

  function remove(index){
    if(state.scenes.length === 1) return;
    state.scenes.splice(index,1);
    renderScenes(); render(); save();
  }

  function toast(message){
    toastEl.textContent = message;
    toastEl.classList.add("show");
    clearTimeout(toast.timer);
    toast.timer = setTimeout(function(){ toastEl.classList.remove("show"); }, 1800);
  }

  function copy(value, message){
    var done = function(){ toast(message); };
    var fallback = function(){
      var ta = document.createElement("textarea");
      ta.value = value;
      ta.setAttribute("readonly","");
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      try{ document.execCommand("copy"); done(); }
      catch(e){ toast("Kopieren nicht möglich – Text bitte markieren."); }
      document.body.removeChild(ta);
    };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(value).then(done, fallback);
    } else {
      fallback();
    }
  }

  /* ---------------------------- Verdrahtung ---------------------------- */

  mainEl.value = state.main;
  mainEl.addEventListener("input", function(){ state.main = mainEl.value; render(); save(); });

  repeatEl.checked = !!state.repeatMain;
  repeatEl.addEventListener("change", function(){ state.repeatMain = repeatEl.checked; render(); save(); });

  document.getElementById("lang-" + (state.lang === "en" ? "en" : "de")).checked = true;
  ["de","en"].forEach(function(code){
    document.getElementById("lang-" + code).addEventListener("change", function(e){
      if(!e.target.checked) return;
      state.lang = code;
      render(); save();
    });
  });

  document.getElementById("add-scene").addEventListener("click", function(){
    state.scenes.push(blankScene());
    renderScenes(); render(); save();
    var cards = scenesEl.children;
    var last = cards[cards.length-1];
    if(last){
      last.scrollIntoView({behavior:"smooth", block:"center"});
      var field = last.querySelector(".scene-title");
      if(field) field.focus();
    }
  });

  document.getElementById("reset").addEventListener("click", function(){
    state.main = "";
    state.scenes = [blankScene()];
    mainEl.value = "";
    renderScenes(); render(); save();
    toast("Alles geleert");
  });

  document.getElementById("copy-all").addEventListener("click", function(){
    copy(fullText(), "Prompt kopiert");
  });

  renderScenes();
  render();
})();
</script>
</html>
